name: poshra

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:17-3.5}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      # Consumed by init/01-databases.sh to create per-service roles.
      MARKETPLACE_DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set in .env}
      CHECKOUT_DB_PASSWORD: ${CHECKOUT_DB_PASSWORD:?set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set in .env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../k8s/base/files/postgres-init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  marketplace:
    build:
      context: ../../services/marketplace
    image: poshra/marketplace:dev
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,marketplace
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: marketplace
      DB_USER: marketplace
      DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set in .env}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?set in .env (make jwt-keys)}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?set in .env (make jwt-keys)}
      JWT_KEY_ID: ${JWT_KEY_ID:-poshra-dev-1}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    # No host port: all traffic enters through Kong.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness-style check; the slim image has no curl, so use Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kong:
    image: ${KONG_IMAGE:-kong:3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Custom plugins are loaded in addition to the bundled ones.
      KONG_PLUGINS: bundled,poshra-leaky-bucket
      KONG_DNS_RESOLVER: 127.0.0.11
      # Ask for A records first. The default order tries SRV first, and the
      # upstream resolver answers unknown names with a parking address.
      KONG_DNS_ORDER: A,CNAME,SRV,LAST
      # Shared memory for bucket state and per-key locks, visible to all workers.
      KONG_NGINX_HTTP_LUA_SHARED_DICT: poshra_leaky_bucket 10m; lua_shared_dict poshra_leaky_bucket_locks 1m
    # The host's DNS search domain resolves anything to a parking address, so
    # Kong's lookup of `web` returned 127.0.53.53. An empty search list forces
    # exact names against Docker's embedded DNS.
    dns_search: "."
    ulimits:
      # Each proxied request uses file descriptors; the default 1024 is too low.
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ../../gateway/kong:/kong:ro
      - ../../gateway/kong/plugins/poshra-leaky-bucket:/usr/local/share/lua/5.1/kong/plugins/poshra-leaky-bucket:ro
    ports:
      - "127.0.0.1:${KONG_PROXY_HOST_PORT:-8080}:8000"
      # Admin API: localhost only, never exposed publicly.
      - "127.0.0.1:${KONG_ADMIN_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
    image: poshra/web:dev
    environment:
      # Server-side calls go back through the gateway, never straight to a
      # service, so the frontend cannot skip auth or rate limiting.
      API_BASE_URL: http://kong:8000/api/marketplace
    depends_on:
      marketplace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
