# Container logs into Loki.
#
# A second collector, as a DaemonSet, because logs are read from each node's
# filesystem rather than pushed over the network. Deliberately the same
# collector as the other signals: one technology reading logs, metrics and
# traces is a smaller thing to understand than three agents with three configs.
#
# The services already write structured JSON, so this parses it rather than
# shipping lines of text — which is what makes "level = error" a query instead
# of a substring search.
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-collector
  namespace: observability
data:
  collector.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        # Kubernetes rotates these; without this the collector would re-read a
        # rotated file from the beginning and duplicate everything in it.
        include_file_path: true
        start_at: end
        retry_on_failure:
          enabled: true
        operators:
          # containerd writes its own framing around each line; this unwraps it
          # and recovers the multi-line entries it split.
          - type: container
            id: container-parser
            add_metadata_from_filepath: true

          # Our own logs are JSON. Parsing them is what turns a level into
          # something you can filter on rather than search for.
          - type: json_parser
            if: 'body matches "^\\{"'
            parse_from: body
            parse_to: attributes
            on_error: send_quiet

          - type: severity_parser
            if: 'attributes.level != nil'
            parse_from: attributes.level
            on_error: send_quiet

          # The trace id travels in the line, never as a label: one stream per
          # request would be the end of Loki. As an attribute, Grafana can
          # still turn it into a link to the trace.
          - type: trace_parser
            if: 'attributes.trace_id != nil'
            trace_id:
              parse_from: attributes.trace_id

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 5s
        send_batch_size: 1024
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name

    exporters:
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-collector
    spec:
      # The collector's own service account already reads pods, which is what
      # the k8sattributes processor needs.
      serviceAccountName: otel-collector
      tolerations:
        # Logs from the control plane matter as much as any other.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.121.0
          args: ["--config=/etc/otel/collector.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
          securityContext:
            # Reading another container's log files needs root on the node;
            # everything else is dropped and the filesystem is read-only.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap: { name: log-collector }
        - name: pod-logs
          hostPath: { path: /var/log/pods }
