apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: poshra

resources:
  - namespace.yaml
  - buckets-job.yaml
  - loki.yaml
  - tempo.yaml
  - prometheus.yaml
  - otel-collector.yaml
  - log-collector.yaml
  - grafana.yaml

configMapGenerator:
  # The dashboards are files in git, mounted where the provider looks. The
  # name hash means a changed dashboard rolls Grafana, which is how a change
  # committed here reaches the screen without anybody clicking import.
  - name: grafana-dashboards
    files:
      - dashboards/red.json
