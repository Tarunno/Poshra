# One pane for all three signals.
#
# The datasources are provisioned from git rather than clicked in, so the
# instance is disposable: delete the pod and it comes back knowing everything.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 30s
          # Lets a spike on a graph carry the trace that produced it.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            # This is what joins logs to traces: the id travels in the line —
            # never as a label, which would make one stream per request — and
            # Grafana turns it into a link.
            - name: trace_id
              matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          # And this joins them back the other way: from a span to the logs
          # that service wrote while it was running.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -2m
            spanEndTimeShift: 2m
            filterByTraceID: true
            tags:
              - key: service.name
                value: service
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  # On the LAN beside Argo CD and Hubble, so it can be opened from a browser
  # without a port-forward.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin, key: username } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            # Nobody should be able to make an account on a dashboard that
            # shows the inside of the system.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: traceqlEditor
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        # Dashboards are provisioned, so nothing here needs to survive a
        # restart; this is just somewhere writable.
        - name: data
          emptyDir: { sizeLimit: 512Mi }
