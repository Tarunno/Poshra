apiVersion: batch/v1
kind: Job
metadata:
  name: marketplace-migrate
  annotations:
    # PreSync: Argo CD runs this and waits for success before applying the rest
    # of the sync. A failed migration stops the deploy instead of shipping code
    # that its database cannot serve.
    argocd.argoproj.io/hook: PreSync
    # A Job's pod template is immutable, so each run needs a fresh Job. Argo
    # deletes the previous one just before creating this one, which also leaves
    # the last run visible for inspection until the next deploy.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: marketplace-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          # No tag: kustomize sets the one being deployed in this sync.
          image: ghcr.io/tarunno/poshra/marketplace
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: marketplace-config }
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: poshra-django, key: DJANGO_SECRET_KEY } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: MARKETPLACE_DB_PASSWORD } }
            - name: JWT_PRIVATE_KEY_B64
              valueFrom: { secretKeyRef: { name: poshra-jwt, key: JWT_PRIVATE_KEY_B64 } }
            - name: JWT_PUBLIC_KEY_B64
              valueFrom: { secretKeyRef: { name: poshra-jwt, key: JWT_PUBLIC_KEY_B64 } }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
