# The sales read model's consumer.
#
# Its own deployment rather than a thread inside the web server: a consumer
# sharing a process with gunicorn would be scaled by request traffic instead of
# by the number of partitions, and would stop consuming whenever the web tier
# restarted. One replica here because the topic is small; it can grow to three,
# which is the partition count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-consumer
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two members joining and leaving the group at
  # once triggers a rebalance for no benefit when there is only one of them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sales-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Long enough for the poll loop to finish what it is holding and leave
      # the group cleanly, so its partitions move without waiting for a timeout.
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: ghcr.io/tarunno/poshra/marketplace:dev
          command: ["python", "manage.py", "consume_orders"]
          envFrom:
            - configMapRef: { name: marketplace-config }
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: poshra-django, key: DJANGO_SECRET_KEY } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: MARKETPLACE_DB_PASSWORD } }
            - name: JWT_PRIVATE_KEY_B64
              valueFrom: { secretKeyRef: { name: poshra-jwt, key: JWT_PRIVATE_KEY_B64 } }
            - name: JWT_PUBLIC_KEY_B64
              valueFrom: { secretKeyRef: { name: poshra-jwt, key: JWT_PUBLIC_KEY_B64 } }
            - name: KAFKA_BROKERS
              value: poshra-kafka-bootstrap:9092
          resources:
            requests: { cpu: 25m, memory: 160Mi }
            limits: { memory: 320Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
