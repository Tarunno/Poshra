apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app.kubernetes.io/name: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: checkout
          image: ghcr.io/tarunno/poshra/checkout:dev
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: poshra-checkout, key: DATABASE_URL } }
            # Headless service name: gRPC resolves every pod behind it and
            # balances across them.
            - name: INVENTORY_ADDR
              value: inventory:50051
            # Catalog reads go through the gateway's internal route, so this
            # service cannot bypass its policies either.
            - name: CATALOG_URL
              value: http://kong-proxy/internal/marketplace
            # The bootstrap Service is only an entry point: the client asks it
            # which broker leads each partition and then talks to that broker
            # directly, so this stays correct as the cluster grows.
            - name: KAFKA_BROKERS
              value: poshra-kafka-bootstrap:9092
            # Tracing. Unset, the service runs with tracing off rather than
            # refusing to start: observability must not be a dependency of
            # serving traffic.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: HTTP_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
