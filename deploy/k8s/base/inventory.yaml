apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  # Headless: gRPC keeps one long-lived HTTP/2 connection, so a normal
  # ClusterIP would pin a client to whichever pod it first connected to.
  # Without an address per pod, the client cannot balance across them.
  clusterIP: None
  selector:
    app.kubernetes.io/name: inventory
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: health
      port: 8081
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory
          image: ghcr.io/tarunno/poshra/inventory:dev
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: poshra-inventory, key: DATABASE_URL } }
            - name: GRPC_ADDR
              value: ":50051"
            - name: HEALTH_ADDR
              value: ":8081"
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # Checks the database: a pod that cannot reach Postgres should
            # leave rotation rather than fail calls.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
