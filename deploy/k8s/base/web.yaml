apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/tarunno/poshra/web:dev
          env:
            # Server-side rendering calls the API through the gateway, so the
            # frontend cannot bypass auth, rate limiting or tracing.
            - name: API_BASE_URL
              value: http://kong-proxy/internal/marketplace
            # The cart needs a signed-in buyer, so it uses the public route
            # rather than the internal one: that is where the gateway verifies
            # the session cookie and injects the identity header.
            - name: CHECKOUT_BASE_URL
              value: http://kong-proxy/api/checkout
            # Writes take the public, rate-limited route. The internal one is
            # unlimited so a page render is not throttled, which is the wrong
            # property for an endpoint anyone can post to.
            - name: API_WRITE_BASE_URL
              value: http://kong-proxy/api/marketplace
            # The assistant is the most expensive route on the gateway, so it
            # goes through the public one with its rate limiter.
            - name: ASSISTANT_BASE_URL
              value: http://kong-proxy/api/assistant
            # The shared render cache. Without it each replica caches alone and
            # an invalidation is only seen by the pod that performed it.
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: poshra-redis, key: REDIS_URL } }
            # Rendering a page is the slowest part of serving one, and it was
            # the part no trace showed: the gateway's span, then the API call
            # it made, and a gap between them where the work happened. OTLP
            # over HTTP, which is what the Next.js instrumentation speaks.
            # Pahara's route. Public and rate limited like the assistant's,
            # because both spend money per question.
            - name: PAHARA_BASE_URL
              value: http://kong-proxy/api/pahara
            # Where a trace id in Pahara's answer opens. The browser follows
            # this, so it is the address a person can reach, not a service DNS
            # name the cluster resolves.
            - name: GRAFANA_PUBLIC_URL
              value: http://192.168.110.203
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Never checks the API: an API outage must not restart the web pods.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Next writes its incremental cache and temporary files at runtime;
            # the root filesystem stays read-only, these do not.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
