apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  # Headless: each replica gets a stable DNS name (postgres-0.postgres).
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              # Subdirectory, so the volume's lost+found does not block initdb.
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: POSTGRES_SUPERUSER_PASSWORD } }
            - name: MARKETPLACE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: MARKETPLACE_DB_PASSWORD } }
            - name: CHECKOUT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: CHECKOUT_DB_PASSWORD } }
            - name: INVENTORY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: INVENTORY_DB_PASSWORD } }
            - name: ASSISTANT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: ASSISTANT_DB_PASSWORD } }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
