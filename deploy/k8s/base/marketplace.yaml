apiVersion: v1
kind: Service
metadata:
  name: marketplace
spec:
  selector:
    app.kubernetes.io/name: marketplace
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace
    spec:
      # Spread replicas over both workers so one node failure cannot take the
      # service down. ScheduleAnyway: on a 2-node cluster a rollout must still
      # be able to place a surge pod.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: marketplace
          image: ghcr.io/tarunno/poshra/marketplace:dev
          envFrom:
            - configMapRef: { name: marketplace-config }
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: poshra-django, key: DJANGO_SECRET_KEY } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: MARKETPLACE_DB_PASSWORD } }
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Liveness never checks the database: a database outage must not
            # trigger a restart loop across every replica.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace
