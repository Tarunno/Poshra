apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poshra

labels:
  # Applied to objects only, not to selectors: selectors are immutable after
  # creation, so keeping them out avoids painful upgrades later.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: poshra

resources:
  - namespace.yaml
  - postgres.yaml
  - marketplace.yaml
  - inventory.yaml
  - checkout.yaml
  - web.yaml
  - network-policies.yaml
  - kong.yaml
  # Argo CD PreSync hooks; see migrations/README.md.
  - migrations/marketplace.yaml
  - migrations/inventory.yaml
  - migrations/checkout.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - 01-databases.sh=files/postgres-init.sh
  - name: marketplace-config
    # No name hash: the migration hook (migrations/marketplace.yaml) references
    # this ConfigMap by a fixed name.
    options:
      disableNameSuffixHash: true
    literals:
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=marketplace,marketplace.poshra.svc.cluster.local,localhost,127.0.0.1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=marketplace
      - DB_USER=marketplace
      - JWT_KEY_ID=poshra-cluster-1
      # The LAN gateway is plain HTTP for now, so Secure cookies would never be
      # stored by the browser. This must be true once TLS is in front.
      - AUTH_COOKIE_SECURE=false
      # Kong verifies tokens and injects the identity header, so the service
      # has no second validation path of its own.
      - AUTH_COOKIE_FALLBACK=false

images:
  - name: ghcr.io/tarunno/poshra/marketplace
    newTag: dev
  - name: ghcr.io/tarunno/poshra/kong
    newTag: dev
  - name: ghcr.io/tarunno/poshra/web
    newTag: dev
  - name: ghcr.io/tarunno/poshra/inventory
    newTag: dev
  - name: ghcr.io/tarunno/poshra/checkout
    newTag: dev
