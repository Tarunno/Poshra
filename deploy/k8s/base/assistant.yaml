apiVersion: v1
kind: Service
metadata:
  name: assistant
spec:
  selector:
    app.kubernetes.io/name: assistant
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
spec:
  # One replica: every answer is a paid model call, so this scales with cost
  # rather than with traffic. Concurrency here is async and IO-bound.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: assistant
          image: ghcr.io/tarunno/poshra/assistant:dev
          env:
            # Which model answers is a deployment decision, not a code change.
            - name: LLM_PROVIDER
              value: gemini
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: poshra-llm, key: GEMINI_API_KEY } }
            # Through the gateway, like every other service-to-service call, so
            # the assistant cannot reach the catalog by a path the storefront
            # could not.
            - name: CATALOG_URL
              value: http://kong-proxy/internal/marketplace
            # The cart tools act as the shopper, carrying their cookie, so this
            # is the public route where the gateway verifies it.
            - name: CHECKOUT_URL
              value: http://kong-proxy/api/checkout
            # The slowest thing in the cluster and the only one billed per
            # request. Every model call becomes a span, and the model's name
            # is in the URL, so which one answered and which refused is in the
            # trace without the code having to say so.
            # How long a shopper waits for one answer, tool calls included.
            # The gateway allows the route 90 seconds; this stops well short,
            # because an answer the caller has already given up on is one that
            # was paid for and thrown away.
            - name: ASSISTANT_TURN_BUDGET
              value: "25"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Never checks Anthropic: an outage there must not restart the pod.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
