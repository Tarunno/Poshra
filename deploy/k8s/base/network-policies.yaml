# Network policy for the poshra namespace.
#
# Services trust the X-User-Id header the gateway injects. That trust is only
# sound if the gateway is the only thing that can reach them, so it is enforced
# here rather than assumed: anything not allowed below cannot open a connection.
#
# Requires a CNI that enforces policy (this cluster runs Cilium).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  # Empty selector: every pod in the namespace. Ingress is denied unless a
  # policy below allows it. Egress is left open; restricting it needs DNS and
  # registry rules and is a separate step.
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kong-accepts-public-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes: [Ingress]
  ingress:
    # The gateway is the front door: it accepts traffic from anywhere,
    # including the LoadBalancer and the LAN.
    - ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marketplace-accepts-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marketplace
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - { protocol: TCP, port: 8000 }
    # Kubelet runs the liveness and readiness probes from the node itself, so
    # the node network must be allowed or every pod is marked unhealthy.
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-accepts-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - { protocol: TCP, port: 3000 }
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-accepts-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: assistant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
        # The node CIDR, so kubelet can run the probes.
        - ipBlock: { cidr: 192.168.110.0/24 }
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pahara-accepts-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pahara
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - { protocol: TCP, port: 8000 }
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-accepts-its-writer-and-the-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        # marketplace stores what artisans upload; kong serves it back out.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
        # Loki and Tempo keep their chunks and blocks here too, from the
        # observability namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - ipBlock: { cidr: 192.168.110.0/24 }
      ports:
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-accepts-the-web-tier-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-accepts-its-services-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        # The service that owns the data, and the one-off jobs that migrate
        # and seed it. The gateway and the frontend have no business here.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sales-consumer
        # The nightly reconciler reads every listing's level out of this
        # database before republishing it. It was allowed through Kafka's
        # policy but not this one, so it never got as far as producing.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stock-reconciler
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inventory
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-migrate
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-accepts-its-callers-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory
  policyTypes: [Ingress]
  ingress:
    - from:
        # Checkout is the only service that reserves stock. The gateway has no
        # route to inventory: it is internal, not a public API.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
        # The catalog reads levels back in one place only: `reconcile_stock`,
        # repairing its own copy from the ledger that owns it. It never calls
        # inventory to serve a page.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace
      ports:
        - { protocol: TCP, port: 50051 }
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 50051 }
        - { protocol: TCP, port: 8081 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-accepts-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - ipBlock:
            cidr: 192.168.110.0/24
      ports:
        - { protocol: TCP, port: 8080 }
