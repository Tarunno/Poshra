apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  annotations:
    # MetalLB hands out an address from the LAN pool (192.168.110.200-210).
    metallb.universe.tf/allow-shared-ip: poshra
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
  ports:
    - name: proxy
      port: 80
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      containers:
        - name: kong
          image: ghcr.io/tarunno/poshra/kong:dev
          env:
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              # Loopback only: the Admin API is never exposed in the cluster.
              value: 127.0.0.1:8001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
            # Resolved by Kong's env vault from {vault://env/poshra-jwt-public-key}.
            # The gateway verifies signatures; only marketplace holds the
            # private key.
            - name: POSHRA_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: poshra-jwt, key: JWT_PUBLIC_KEY_B64 }
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          readinessProbe:
            httpGet: { path: /status/ready, port: status }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: status }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
