apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local 3-node cluster (1 control plane + 2 workers) on 192.168.110.0/24.
resources:
  - ../../base

# CI replaces these tags with the built commit SHA:
#   sed -i "s|newTag: 36ba6c32f9831146db78f42200b8bab4dcabee30
images:
  - name: ghcr.io/tarunno/poshra/marketplace
    newTag: 36ba6c32f9831146db78f42200b8bab4dcabee30
  - name: ghcr.io/tarunno/poshra/web
    newTag: 36ba6c32f9831146db78f42200b8bab4dcabee30
  - name: ghcr.io/tarunno/poshra/inventory
    newTag: 36ba6c32f9831146db78f42200b8bab4dcabee30
  - name: ghcr.io/tarunno/poshra/kong
    newTag: 36ba6c32f9831146db78f42200b8bab4dcabee30
