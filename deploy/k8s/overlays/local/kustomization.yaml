apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local 3-node cluster (1 control plane + 2 workers) on 192.168.110.0/24.
resources:
  - ../../base

# CI rewrites every tag below to the commit it built, and commits the result:
# the git history is the deployment history. Every service that ships an image
# needs a line here, or the base's floating "dev" tag is what gets deployed.
images:
  - name: ghcr.io/tarunno/poshra/marketplace
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
  - name: ghcr.io/tarunno/poshra/web
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
  - name: ghcr.io/tarunno/poshra/inventory
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
  - name: ghcr.io/tarunno/poshra/kong
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
  - name: ghcr.io/tarunno/poshra/assistant
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
  - name: ghcr.io/tarunno/poshra/checkout
    newTag: 7715d9e2f5562d83483561f95b3e20c7e587cb04
