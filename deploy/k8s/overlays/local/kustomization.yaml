apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local 3-node cluster (1 control plane + 2 workers) on 192.168.110.0/24.
resources:
  - ../../base

# CI replaces these tags with the built commit SHA:
#   sed -i "s|newTag: c7bad2ff028f897b86abc3c9dda16bc56edb398b
images:
  - name: ghcr.io/tarunno/poshra/marketplace
    newTag: c7bad2ff028f897b86abc3c9dda16bc56edb398b
  - name: ghcr.io/tarunno/poshra/web
    newTag: c7bad2ff028f897b86abc3c9dda16bc56edb398b
  - name: ghcr.io/tarunno/poshra/kong
    newTag: c7bad2ff028f897b86abc3c9dda16bc56edb398b
