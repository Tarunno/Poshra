apiVersion: batch/v1
kind: Job
metadata:
  # generateName: a Job's pod template is immutable, so each run is a new Job.
  generateName: inventory-migrate-
  namespace: poshra
  labels:
    app.kubernetes.io/part-of: poshra
    app.kubernetes.io/name: inventory-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: poshra-inventory, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
