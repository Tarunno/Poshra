apiVersion: batch/v1
kind: Job
metadata:
  # generateName: a Job's pod template is immutable, so every run creates a new
  # Job. Applied with `kubectl create`, never `kubectl apply`.
  generateName: marketplace-migrate-
  namespace: poshra
  labels:
    app.kubernetes.io/part-of: poshra
    app.kubernetes.io/name: marketplace-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          # Replaced with the exact image being deployed (see `make k8s-migrate`).
          image: IMAGE_PLACEHOLDER
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: marketplace-config }
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: poshra-django, key: DJANGO_SECRET_KEY } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: poshra-db, key: MARKETPLACE_DB_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
