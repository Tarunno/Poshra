# The observability stack, deployed the same way as the application it watches.
#
# Anything the cluster runs belongs in git, reconciled — a lesson deploy/kafka
# taught three times before it was given an Application of its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poshra-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tarunno/Poshra.git
    targetRevision: main
    path: deploy/k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is part of the manifests.
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
