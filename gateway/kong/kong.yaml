# Kong declarative configuration (DB-less mode).
# Validate: make kong-validate   Apply without restart: make kong-reload
_format_version: "3.0"

services:
  - name: marketplace
    url: http://marketplace:8000
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    # Never replay requests: POSTs (login, orders) are not safe to send twice.
    retries: 0
    routes:
      # Public edge: browsers and external agents. Authentication is optional
      # so anonymous visitors can browse; when a token is present it is
      # verified here and the services receive a trusted identity.
      - name: marketplace-api
        paths:
          - /api/marketplace
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: poshra-identity
            config:
              public_key_b64: "{vault://env/poshra-jwt-public-key}"
              issuer: poshra-marketplace
              audience: poshra-api
              # Must match ACCESS_COOKIE_NAME in the marketplace service.
              # Becomes "__Host-poshra_at" once TLS is in front: that prefix
              # requires the Secure attribute, which plain HTTP cannot set.
              access_cookie: poshra_at
          # Rate limit per signed-in user where we know who they are, falling
          # back to the client address for anonymous traffic. Without this a
          # household behind one address would share a single budget.
          - name: poshra-leaky-bucket
            config:
              rate: 5
              burst: 10
              limit_by: header
              header_name: X-User-Id

      # Internal path for server-side rendering. One page render makes several
      # API calls, and every pod shares one source address, so a per-client
      # limit would throttle the storefront itself. Still passes through the
      # gateway for identity and tracing; reachable only from inside the
      # cluster network.
      - name: marketplace-internal
        paths:
          - /internal/marketplace
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 10.244.0.0/16   # Kubernetes pod network
                - 172.16.0.0/12   # Docker Compose networks
          - name: poshra-identity
            config:
              public_key_b64: "{vault://env/poshra-jwt-public-key}"
              issuer: poshra-marketplace
              audience: poshra-api
              # Must match ACCESS_COOKIE_NAME in the marketplace service.
              # Becomes "__Host-poshra_at" once TLS is in front: that prefix
              # requires the Secure attribute, which plain HTTP cannot set.
              access_cookie: poshra_at

  # Credentials live on their own service so that stripping the matched path
  # still lands on /auth/... upstream: Kong appends what remains after the
  # match to the service URL.
  # Credentials live on their own service so that stripping the matched path
  # still lands on /auth/... upstream: Kong appends whatever follows the match
  # to the service URL.
  - name: marketplace-auth
    url: http://marketplace:8000/auth
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    retries: 0
    routes:
      # Exempt from identity checks: a valid access token cannot exist before
      # login, and refresh runs precisely when it has expired. Rate limited
      # hard instead, because this is where credential stuffing lands.
      - name: marketplace-auth
        paths:
          - /api/marketplace/auth
        strip_path: true
        protocols: [http, https]
        plugins:
          # Cannot verify a token here, but still refuses to pass a
          # client-supplied identity header through to the service.
          - name: poshra-identity
            config:
              strip_only: true
          - name: poshra-leaky-bucket
            config:
              rate: 1
              burst: 8
              limit_by: ip

  # Photographs. The bucket is public — these are on a public storefront — so
  # this route carries no identity plugin; the credentials guard writes only,
  # and writes never come this way.
  - name: media
    url: http://minio:9000/poshra-media
    connect_timeout: 2000
    read_timeout: 15000
    routes:
      - name: media-objects
        paths:
          - /media
        strip_path: true
        methods: [GET, HEAD]
        protocols: [http, https]

  # The shopping assistant. Every answer is a paid model call, so this is the
  # most tightly limited route on the gateway and it never retries: a replayed
  # request is a second bill for an answer nobody read.
  - name: assistant
    url: http://assistant:8000
    connect_timeout: 2000
    # An answer that calls tools can take the better part of a minute.
    read_timeout: 90000
    write_timeout: 90000
    retries: 0
    routes:
      - name: assistant-api
        paths:
          - /api/assistant
        strip_path: true
        protocols: [http, https]
        # The answer is streamed as it is written, and Kong buffers a
        # response whole by default. Left on, every token would arrive at
        # once at the end — a slow request wearing a stream's clothes.
        response_buffering: false
        plugins:
          - name: poshra-identity
            config:
              public_key_b64: "{vault://env/poshra-jwt-public-key}"
              issuer: poshra-marketplace
              audience: poshra-api
              access_cookie: poshra_at
              require_authentication: true
          - name: poshra-leaky-bucket
            config:
              # About one question every five seconds, six in a burst: enough
              # for a conversation, not enough to run up a bill.
              rate: 0.2
              burst: 6
              limit_by: header
              header_name: X-User-Id

  # পাহারা, the watch: an agent that reads the cluster's own telemetry. Behind
  # the same identity check as everything else, because reading the traces
  # means reading what every shopper did.
  - name: pahara
    url: http://pahara:8000
    connect_timeout: 2000
    # An investigation is several model calls and several queries over an hour
    # of traces. Its own budget stops at 60s; this leaves room to answer.
    read_timeout: 90000
    write_timeout: 90000
    retries: 0
    routes:
      - name: pahara-api
        paths:
          - /api/pahara
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: poshra-identity
            config:
              public_key_b64: "{vault://env/poshra-jwt-public-key}"
              issuer: poshra-marketplace
              audience: poshra-api
              access_cookie: poshra_at
              require_authentication: true
          - name: poshra-leaky-bucket
            config:
              # Tighter than the shopper's: one question a minute, three in a
              # burst. An operator asking repeatedly during an incident is
              # exactly when a runaway bill is easiest to miss.
              rate: 0.0167
              burst: 3
              limit_by: header
              header_name: X-User-Id

  # The storefront as an MCP server. One endpoint carries the whole protocol:
  # an agent POSTs JSON-RPC to /mcp and gets tools/list, tools/call and the
  # rest back. The path is deliberately short and unversioned, because it is a
  # URL a person pastes into their agent.
  - name: mcp-storefront
    url: http://mcp-storefront:8000
    connect_timeout: 2000
    # A tool call is one catalog query, not a model call — nothing here waits
    # on an LLM. Generous rather than long, so a slow search still answers.
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: mcp-storefront
        paths:
          - /mcp
        # The upstream serves the protocol at /mcp itself, so the path is
        # passed through rather than stripped. Note the absence of `methods`:
        # a route that names them outranks a longer path prefix, which is how
        # a POST rule on "/" once swallowed every API call in the cluster.
        strip_path: false
        protocols: [http, https]
        # The transport answers with plain JSON today and may stream tomorrow
        # — elicitation and sampling both need the server to talk mid-call.
        # Buffering here would hold a stream until it ended, which is the
        # assistant's SSE bug waiting to happen again.
        response_buffering: false
        plugins:
          # No sign-in required: these three tools read the same catalog an
          # anonymous visitor already browses. The plugin still runs, in
          # strip-only mode, so nothing outside can hand us an X-User-Id and
          # be believed. The cart tools will need the real thing.
          - name: poshra-identity
            config:
              strip_only: true
          - name: poshra-leaky-bucket
            config:
              # By address, because there is nobody to attribute this to yet.
              # One turn of an agent is several tool calls, so the burst is
              # what matters more than the rate.
              rate: 2
              burst: 20
              limit_by: ip

  # Cart and orders. Every endpoint here needs a buyer, so the identity plugin
  # is set to require authentication rather than allow anonymous browsing.
  - name: checkout
    url: http://checkout:8080
    connect_timeout: 2000
    # Longer than the others: placing an order reserves stock and charges a
    # payment before replying.
    read_timeout: 30000
    write_timeout: 30000
    # An order must never be replayed by the gateway.
    retries: 0
    routes:
      - name: checkout-api
        paths:
          - /api/checkout
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: poshra-identity
            config:
              public_key_b64: "{vault://env/poshra-jwt-public-key}"
              issuer: poshra-marketplace
              audience: poshra-api
              access_cookie: poshra_at
              require_authentication: true
          - name: poshra-leaky-bucket
            config:
              rate: 5
              burst: 10
              limit_by: header
              header_name: X-User-Id

  # The Next.js frontend. `web` resolves to the Compose service locally and to
  # the Kubernetes Service in the cluster, so one config works in both places.
  # Serving the app and the API from one origin is what makes the auth cookies
  # work.
  - name: web
    url: http://web:3000
    connect_timeout: 2000
    # Long enough for the slowest thing a server action does, which is drafting
    # a listing: the assistant's own route allows 90s for that, and the hop in
    # front of it has to allow more or the inner allowance is a fiction.
    #
    # This was briefly a second service matching POST only, so that page
    # renders could keep a shorter leash. That is a trap: Kong ranks a method
    # match above a longer path prefix, so a route on "/" matching POST
    # swallowed every POST to /api and /internal — login, cart, checkout and
    # the assistant all answered with the web tier's 404 page. One upstream,
    # one timeout.
    read_timeout: 120000
    write_timeout: 120000
    retries: 0
    routes:
      - name: web-app
        paths:
          - /
        strip_path: false
        protocols: [http, https]

# Global plugins. One block only: a second top-level `plugins:` key is valid
# YAML and silently wins, which is how the tracing plugin below was quietly
# dropped while `kong config parse` still reported success.
plugins:
  # The trace has to start at the gateway, or the first thing anyone sees is a
  # service reporting its own duration, after the request had already spent
  # time being routed and authenticated.
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
      resource_attributes:
        service.name: kong
      # W3C traceparent, the same format the Go and Python services read, so
      # every service agrees which request this is.
      header_type: w3c

  # Every request gets an ID that is logged by Kong, passed upstream and returned
  # to the client, so one request can be followed across services and logs.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
