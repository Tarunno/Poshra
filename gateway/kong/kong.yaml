# Kong declarative configuration (DB-less mode).
# Validate: make kong-validate   Apply without restart: make kong-reload
_format_version: "3.0"

services:
  - name: marketplace
    url: http://marketplace:8000
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    # Never replay requests: POSTs (login, orders) are not safe to send twice.
    retries: 0
    routes:
      # Public edge: browsers and external agents. Rate limited per client.
      - name: marketplace-api
        paths:
          - /api/marketplace
        strip_path: true
        protocols: [http, https]
        plugins:
          # Leaky bucket (GCRA): a steady 5 req/s per client IP with bursts of
          # up to 10. Unlike a fixed window, a client cannot double its rate at
          # a window boundary. Plugin: gateway/kong/plugins/poshra-leaky-bucket
          - name: poshra-leaky-bucket
            config:
              rate: 5
              burst: 10
              limit_by: ip

      # Internal path for server-side rendering. One page render makes several
      # API calls, and every pod shares one source address, so a per-client
      # limit would throttle the storefront itself. Still passes through the
      # gateway for auth, tracing and one place to change policy; reachable
      # only from inside the cluster network.
      - name: marketplace-internal
        paths:
          - /internal/marketplace
        strip_path: true
        protocols: [http, https]
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 10.244.0.0/16   # Kubernetes pod network
                - 172.16.0.0/12   # Docker Compose networks

  # The Next.js frontend. `web` resolves to the Compose service locally and to
  # the Kubernetes Service in the cluster, so one config works in both places.
  # Serving the app and the API from one origin is what makes the auth cookies
  # work.
  - name: web
    url: http://web:3000
    connect_timeout: 2000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: web-app
        paths:
          - /
        strip_path: false
        protocols: [http, https]

plugins:
  # Every request gets an ID that is logged by Kong, passed upstream and returned
  # to the client, so one request can be followed across services and logs.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
