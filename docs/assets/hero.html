<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Composition for the README hero, three devices with three jobs.
         The monitor carries the shop, which is what the thing is. The
         laptop carries the page an artisan speaks a listing into, which is
         what makes it different — and it has to be read rather than
         recognised, so it gets a surface nothing crops. The phone says the
         same storefront works in a hand. */
      :root {
        --ink: #1a1523;
        --cream: #fffcf5;
        --saffron: #fff1cc;
        --rose: #ffe4ee;
        --mint: #ddf5e6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1600px;
        height: 1000px;
        background:
          radial-gradient(1200px 700px at 78% 12%, var(--rose) 0%, transparent 60%),
          radial-gradient(1000px 600px at 12% 85%, var(--mint) 0%, transparent 62%),
          var(--saffron);
        font-family: system-ui, sans-serif;
        position: relative;
        overflow: hidden;
      }

      /* Stitched border, the same language as the product */
      body::after {
        content: "";
        position: absolute;
        inset: 26px;
        border: 3px dashed rgba(26, 21, 35, 0.18);
        border-radius: 40px;
        pointer-events: none;
      }

      .stage { position: absolute; inset: 0; }

      /* ---------- monitor (back) ---------- */
      .monitor { position: absolute; top: 52px; right: 70px; width: 880px; }
      .monitor .panel {
        background: var(--ink);
        border-radius: 20px;
        /* A wider chin than bezel: what makes a monitor read as a monitor. */
        padding: 13px 13px 42px;
        box-shadow: 0 45px 80px -25px rgba(26, 21, 35, 0.42);
      }
      .monitor .screen {
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }
      .monitor .screen img { display: block; width: 100%; }
      .monitor .badge {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 54px;
        height: 7px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.16);
      }
      .monitor .neck {
        width: 150px;
        height: 54px;
        margin: 0 auto;
        background: linear-gradient(#241e30, #17131f);
        clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
      }
      .monitor .foot {
        width: 330px;
        height: 13px;
        margin: 0 auto;
        border-radius: 0 0 10px 10px;
        background: linear-gradient(#211b2c, #131019);
      }

      /* ---------- laptop (front left) ---------- */
      .laptop { position: absolute; left: 46px; bottom: 78px; width: 800px; }
      .laptop .lid {
        background: var(--ink);
        border-radius: 20px;
        padding: 13px 13px 17px;
        box-shadow: 0 50px 90px -25px rgba(26, 21, 35, 0.5);
      }
      .laptop .screen {
        border-radius: 9px;
        overflow: hidden;
        background: #fff;
      }
      .laptop .screen img { display: block; width: 100%; }
      .laptop .camera {
        width: 6px; height: 6px; border-radius: 50%;
        background: #3b3542; margin: 0 auto 8px;
      }
      .laptop .base {
        width: 910px;
        margin-left: -55px;
        height: 15px;
        background: linear-gradient(#2a2433, #15121c);
        border-radius: 0 0 14px 14px;
        position: relative;
      }
      .laptop .notch-base {
        position: absolute; left: 50%; transform: translateX(-50%);
        width: 130px; height: 6px; border-radius: 0 0 8px 8px;
        background: rgba(255, 255, 255, 0.14);
      }

      /* ---------- tablet (front right) ----------
         An even bezel all round and no button: what makes a slab read as a
         tablet rather than a large phone. */
      .tablet {
        position: absolute;
        right: 44px;
        bottom: 96px;
        width: 336px;
        background: var(--ink);
        border-radius: 26px;
        padding: 12px;
        box-shadow: 0 45px 80px -20px rgba(26, 21, 35, 0.45);
        transform: rotate(1.6deg);
      }
      .tablet .screen {
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
      }
      .tablet .screen img { display: block; width: 100%; }
      .tablet .camera {
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #3b3542;
      }

      /* ---------- phone (front right) ---------- */
      .phone {
        position: absolute;
        right: 400px;
        bottom: 56px;
        width: 250px;
        background: var(--ink);
        border-radius: 38px;
        padding: 9px;
        box-shadow: 0 45px 80px -20px rgba(26, 21, 35, 0.5);
        transform: rotate(-2deg);
      }
      .phone .screen {
        border-radius: 30px;
        overflow: hidden;
        background: #fff;
        position: relative;
      }
      .phone .screen img { display: block; width: 100%; }
      .phone .island {
        position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
        width: 78px; height: 20px; border-radius: 11px; background: var(--ink);
      }

      /* ---------- caption ---------- */
      .caption { position: absolute; left: 78px; top: 76px; }
      .caption h1 {
        font-size: 44px; letter-spacing: -0.02em; color: var(--ink); font-weight: 800;
      }
      .caption p { margin-top: 8px; font-size: 19px; color: rgba(26, 21, 35, 0.68); }
      .bn { font-size: 17px; color: rgba(26, 21, 35, 0.55); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caption">
        <p class="bn">পসরা</p>
        <h1>Poshra</h1>
        <p>Crafts from Bangladesh, sold the way they deserve.</p>
      </div>

      <div class="monitor">
        <div class="panel">
          <div class="screen"><img src="cap-shop.png" alt="" /></div>
          <div class="badge"></div>
        </div>
        <div class="neck"></div>
        <div class="foot"></div>
      </div>

      <div class="laptop">
        <div class="lid">
          <div class="camera"></div>
          <div class="screen"><img src="cap-drafting.png" alt="" /></div>
        </div>
        <div class="base"><div class="notch-base"></div></div>
      </div>

      <div class="tablet">
        <div class="camera"></div>
        <div class="screen"><img src="cap-pahara.png" alt="" /></div>
      </div>

      <div class="phone">
        <div class="screen">
          <div class="island"></div>
          <img src="cap-mobile.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
