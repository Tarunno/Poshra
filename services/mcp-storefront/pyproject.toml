[project]
name = "poshra-mcp-storefront"
version = "0.1.0"
description = "Poshra storefront as a remote MCP server"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The protocol itself. 2.x renamed FastMCP to MCPServer and moved the
    # transports; the pin is a major-version pin because that rename is the
    # kind of change that arrives without a deprecation.
    "mcp>=2.2,<3",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Same collector as every other service, so an agent's search shows up in
    # the same trace as the catalog query it caused.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-starlette>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
