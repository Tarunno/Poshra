[project]
name = "poshra-assistant"
version = "0.1.0"
description = "Poshra assistant: conversational shopping over the catalog"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    # Multipart form parsing, for the photograph a listing is drafted from.
    # FastAPI needs it present to declare a File parameter at all.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # The slowest service in the cluster and the only one that costs money per
    # request; before these it was also the only one with no spans at all.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares what a parameter is by calling these in the default. It is
# the framework's idiom, not the mutable-default bug B008 is looking for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]
