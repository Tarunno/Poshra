[project]
name = "poshra-marketplace"
version = "0.1.0"
description = "Poshra marketplace service: accounts, artisans, catalog, order read-model"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "djangorestframework>=3.15",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "confluent-kafka>=2.6",
    "boto3>=1.35",
    "pillow>=11.0",
    # Direct: the stock reconcile command calls inventory's gRPC API with the
    # stubs in gen/. It arrives with the OTLP exporter too, but a module this
    # code imports by name belongs in the list.
    "grpcio>=1.68",
    "protobuf>=5.29",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-psycopg>=0.51b0",
    # Turns every request into a span, with the gateway's traceparent as its
    # parent. Without it this service is a gap in the middle of every trace.
    "opentelemetry-instrumentation-django>=0.51b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Django generates migrations, and protoc generates the stubs in gen/. Neither
# is hand-written, and both are overwritten the next time they are generated,
# so linting them only produces noise nobody can act on.
extend-exclude = ["**/migrations/*", "gen/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
