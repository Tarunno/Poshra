[project]
name = "poshra-marketplace"
version = "0.1.0"
description = "Poshra marketplace service: accounts, artisans, catalog, order read-model"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "djangorestframework>=3.15",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "confluent-kafka>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Django generates migrations; they are not hand-written code.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
