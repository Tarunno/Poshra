name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; a newer push cancels an older queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      marketplace: ${{ steps.filter.outputs.marketplace }}
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      inventory: ${{ steps.filter.outputs.inventory }}
      checkout: ${{ steps.filter.outputs.checkout }}
      assistant: ${{ steps.filter.outputs.assistant }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            marketplace:
              - 'services/marketplace/**'
            web:
              - 'apps/web/**'
            gateway:
              - 'gateway/kong/**'
            inventory:
              - 'services/inventory/**'
              - 'proto/**'
            checkout:
              - 'services/checkout/**'
              - 'services/inventory/gen/**'
            assistant:
              - 'services/assistant/**'
            deploy:
              - 'deploy/k8s/**'

  test-marketplace:
    name: test marketplace
    needs: changes
    if: needs.changes.outputs.marketplace == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  test-assistant:
    name: test assistant
    needs: changes
    if: needs.changes.outputs.assistant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No API key: the tests replay scripted model responses, so the loop is
      # covered without paying for it or depending on the network.
      - run: uv run pytest -q

  test-gateway:
    name: test kong plugins
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a config with duplicate top-level keys
        run: python3 gateway/kong/tests/no_duplicate_keys.py gateway/kong/kong.yaml

      # The GCRA unit tests run in the Kong image, which ships the resty CLI.
      - run: |
          docker run --rm -v "${{ github.workspace }}/gateway/kong:/kong:ro" \
            --entrypoint resty kong:3.9.3 /kong/tests/gcra_test.lua

  test-inventory:
    name: test inventory
    needs: changes
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against the previous commit, which needs history.
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          # Fails the build on a change that would break a deployed client:
          # a renumbered field, a changed type, a removed RPC.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/inventory/go.sum

      - name: Check the generated code is up to date
        run: |
          # A contract change that is not regenerated would compile against
          # stale types, so CI regenerates and fails on any difference.
          docker run --rm -v "$PWD/proto:/workspace" -v "$PWD/services:/services" \
            -w /workspace bufbuild/buf:latest generate
          git diff --exit-code services/inventory/gen

      - name: Test
        working-directory: services/inventory
        run: |
          go vet ./...
          go test ./...

  test-checkout:
    name: test checkout
    needs: changes
    if: needs.changes.outputs.checkout == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/checkout/go.sum
      - name: Test
        working-directory: services/checkout
        run: |
          go vet ./...
          # Testcontainers starts a real Postgres; the runner has Docker.
          go test ./...

  build:
    name: build ${{ matrix.service }}
    needs:
      [
        changes,
        test-marketplace,
        test-assistant,
        test-gateway,
        test-inventory,
        test-checkout,
      ]
    # Run when the needed tests pass or were skipped, but not if one failed.
    if: always() && !contains(needs.*.result, 'failure') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: marketplace
            context: services/marketplace
          - service: kong
            context: gateway/kong
          - service: web
            context: apps/web
          - service: inventory
            context: services/inventory
          - service: checkout
            context: services
            dockerfile: services/checkout/Dockerfile
          - service: assistant
            context: services
            dockerfile: services/assistant/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects upper-case names, and the owner is "Tarunno".
      - name: Compute image name
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/poshra" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          # Immutable tag (commit SHA) is what gets deployed; `main` is a
          # convenience pointer. Never deploy a moving tag.
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifests:
    name: pin image tags in git
    needs: build
    # `build` runs under always(), so a skipped test job upstream marks this job
    # skipped too unless the condition is explicit about what it requires.
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Argo CD deploys what git says, so "deploying" means committing the new
      # immutable tag. The cluster pulls the change; CI never touches it.
      - name: Set image tags to this commit
        working-directory: deploy/k8s/overlays/local
        run: |
          sed -i "/^#/! s|newTag: .*|newTag: ${{ github.sha }}|" kustomization.yaml
          cat kustomization.yaml

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "image tags already current"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): pin images to ${{ github.sha }} [skip ci]"
          git push
