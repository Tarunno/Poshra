version: v2
managed:
  enabled: false
plugins:
  # Message types and (de)serialisation.
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: ../services/inventory/gen
    opt: paths=source_relative
  # Client and server interfaces for the service definition.
  - remote: buf.build/grpc/go:v1.5.1
    out: ../services/inventory/gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
  # The same messages for the catalog, which reads levels back when repairing
  # its copy of them (services/marketplace/catalog/inventory_client.py).
  - remote: buf.build/protocolbuffers/python:v29.3
    out: ../services/marketplace/gen
  - remote: buf.build/grpc/python:v1.69.0
    out: ../services/marketplace/gen
